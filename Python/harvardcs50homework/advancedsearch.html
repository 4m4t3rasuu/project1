<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Advanced Search</h1>
        <div class="links">
            <a href="index.html">Google Search</a>
        </div>
        <p>Find pages with</p>

     <form action="https://www.google.com/search"></form>   
            <div> 

                <label for="a">All of these words:</label>
                <input type="text" id="a" name="as_q">
            </div>

            <div> 
                <label for="b">Exact word or phrase:</label>
                <input type="text" id="b" name="as_epq">
            </div>

            <div> 
                <label for="c">Any of these words:</label>
                <input type="text" id="c" name="as_oq">
            </div>

            <div> 
                <label for="d">None of these words:</label>
                <input type="text" id="d" name="as_eq">
            </div>
            <button type="submit">Advanced Search</button>
        </form>
    </body>
</html>
