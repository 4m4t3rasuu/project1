<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
    </head>
    <body>
        <h1>Advanced Search</h1>
        <div class="links">
            <a href="index.html">Google Search</a>
        </div>
        <p>Find pages with</p>
        
        <div> 
            <form action="https://www.google.com/search">
                <label for="a">All of these words:</label>
                <input type="text" id="a" name="as_q">
            </form>
        </div>

        <div> 
            <form action="https://www.google.com/search">
                <label for="a">Exact word or phrase:</label>
                <input type="text" id="b" name="as_epq">
             </form>
        </div>

        <div> 
            <form action="https://www.google.com/search">
                <label for="c">Any of these words:</label>
                <input type="Any of these words:" id="c" name="as_oq">
            </form>
        </div>

        <div> 
            <form action="https://www.google.com/search">
                <label for="d">None of these words:</label>
                <input type="None of these words:" id="d" name="as_eq">
            </form>
        </div>
        <button type="submit">Advanced Search</button>
    </body>
</html>
