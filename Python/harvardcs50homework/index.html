<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="links">
            <a href="imagesearch.html">Image Search</a>
            <a href="advancedsearch.html">Advanced Search</a>
        </div>
        <div class="png">
            <img src="googly.png" alt="Googly">
        </div>
        <form action="https://www.google.com/search">
        <div class="search-container">
            <input type="text" name="q" class="search-bar">
            <div class="button-row">
                <input type="submit" value="Google Search" class="search-bar-extension">
                <button type="submit" name="btnI" value="1" class="search-bar-extension">I'm Feeling Lucky</button>
            </div>
        </div>
        </form>
    </body>
</html>
